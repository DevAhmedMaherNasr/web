<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الأسئلة والإجابات</title>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; background: #f0f2f5; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; }
        button { padding: 12px 25px; font-size: 16px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #218838; }
        .result { margin-top: 20px; }
        img { max-width: 100%; height: auto; border: 2px solid #ddd; border-radius: 8px; margin-top: 10px; }
        .error { color: red; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>البحث عن الأسئلة والإجابات</h2>
        <p style="color: #666; font-size: 14px;">اكتب جزء من السؤال للبحث عن الصورة المطابقة:</p>
        
        <input type="text" id="searchBox" placeholder="اكتب الكلمة أو السؤال هنا...">
        <br>
        <button onclick="searchQuestion()">ابحث</button>

        <div class="result" id="resultArea"></div>
    </div>

    <script>
        // هنا قاعدة البيانات: اكتب الكلمة المفتاحية واسم الصورة الخاصة بها
        const questions = [
            { keyword: "السؤال الأول", img: "q1.png" },
            { keyword: "السؤال الثاني", img: "q2.png" },
            // تقدر تضيف باقي الأسئلة بنفس الشكل هنا تحت بعض:
            // { keyword: "كلمة من السؤال", img: "اسم_الصورة.jpg" },
        ];

        function searchQuestion() {
            let query = document.getElementById('searchBox').value.trim().toLowerCase();
            let resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = "";

            if (!query) {
                resultArea.innerHTML = "<p class='error'>من فضلك اكتب كلمة للبحث أولاً!</p>";
                return;
            }

            // البحث عن مطابقة الكلمة داخل الأسئلة
            let found = questions.find(q => q.keyword.toLowerCase().includes(query));

            if (found) {
                resultArea.innerHTML = `<p><strong>نتيجة البحث:</strong></p><img src="${found.img}" alt="صورة الإجابة">`;
            } else {
                resultArea.innerHTML = "<p class='error'>عذراً، لم يتم العثور على سؤال مطابق.</p>";
            }
        }
    </script>

</body>
</html>
